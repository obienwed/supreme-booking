[build]
  command = "echo no build"
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# old ?city=miami links go to the Miami page
[[redirects]]
  from = "/"
  to = "/miami/"
  status = 301
  query = {city = "miami"}
  force = true

# netlify.app address points to the real domain
[[redirects]]
  from = "https://supremebooking.netlify.app/*"
  to = "https://lasvegaspartybuscrawl.com/:splat"
  status = 301
  force = true

# repo source folders are not part of the website
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
